
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith Anime</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090b12;color:#fff;
  font-family:Arial,sans-serif
}
header{
  padding:18px;background:#111522;
  border-bottom:1px solid #292d42;
  position:sticky;top:0
}
.logo{font-size:25px;font-weight:bold;color:#21d4fd}
.search{display:flex;gap:8px;margin-top:15px}
input{
  flex:1;min-width:0;padding:12px;
  background:#090b12;color:white;
  border:1px solid #393e55;border-radius:8px
}
button{
  padding:11px 14px;border:0;border-radius:8px;
  background:#7655ff;color:white;cursor:pointer
}
main{padding:18px;max-width:1100px;margin:auto}
.hero{
  padding:25px;border-radius:15px;
  background:linear-gradient(120deg,#251d50,#102b40);
  margin-bottom:25px
}
.hero h1{font-size:32px;margin:0 0 10px}
.hero p{color:#c6c9da}
h2{font-size:21px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px
}
.card{
  background:#141827;border:1px solid #292d42;
  border-radius:12px;overflow:hidden;cursor:pointer
}
.poster{
  height:190px;display:flex;align-items:end;
  padding:12px;font-weight:bold;font-size:20px;
  background:linear-gradient(145deg,#493c80,#111827)
}
.card:nth-child(2n) .poster{
  background:linear-gradient(145deg,#126176,#15172b)
}
.info{padding:12px}
.info p{font-size:12px;color:#adb5cc}
#playerSection{
  display:none;margin-top:25px;padding:15px;
  background:#141827;border-radius:12px
}
video{width:100%;margin-top:12px;background:#000}
.episodes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{color:#b8bfd3;font-size:13px;line-height:1.5}
@media(min-width:650px){
 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
 .poster{height:240px}
}
</style>
</head>
<body>
<header>
  <div class="logo">ZENITH ANIME ⚡</div>
  <div class="search">
    <input id="search" placeholder="Search anime...">
    <button onclick="filterAnime()">Search</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Explore Anime World</h1>
    <p>Discover your next favourite anime.</p>
    <button onclick="document.getElementById('catalog').scrollIntoView()">Explore Now</button>
  </section>

  <h2 id="catalog">Popular Anime</h2>
  <div class="grid" id="animeGrid"></div>

  <section id="playerSection">
    <h2 id="animeTitle">Anime</h2>
    <button onclick="closePlayer()">Close ✕</button>
    <p class="note" id="episodeInfo">Select an episode.</p>
    <video id="video" controls playsinline></video>
    <div class="episodes" id="episodes"></div>
    <p class="note">
      To play a video, add a direct video URL that you own
      or are authorised to use. Episode buttons are demo
      controls until episode sources are configured.
    </p>
    <input id="videoUrl" placeholder="Paste authorised video URL">
    <button onclick="loadVideo()">Load Video</button>
  </section>
</main>

<script>
const animeData=[
 {name:"Demon Slayer",year:2019,count:26},
 {name:"Solo Leveling",year:2024,count:12},
 {name:"Blue Lock",year:2022,count:24},
 {name:"Jujutsu Kaisen",year:2020,count:24},
 {name:"Naruto",year:2002,count:220},
 {name:"Attack on Titan",year:2013,count:25},
 {name:"One Punch Man",year:2015,count:12},
 {name:"Spy x Family",year:2022,count:25}
];

const grid=document.getElementById("animeGrid");
let currentAnime=null;

function render(list){
 grid.innerHTML="";
 list.forEach(anime=>{
  const card=document.createElement("div");
  card.className="card";

  const poster=document.createElement("div");
  poster.className="poster";
  poster.textContent=anime.name;

  const info=document.createElement("div");
  info.className="info";

  const title=document.createElement("strong");
  title.textContent=anime.name;

  const meta=document.createElement("p");
  meta.textContent=anime.year+" • "+anime.count+" episodes";

  info.append(title,meta);
  card.append(poster,info);
  card.onclick=()=>openAnime(anime);
  grid.appendChild(card);
 });
}

function filterAnime(){
 const query=document.getElementById("search").value
  .trim().toLowerCase();
 render(animeData.filter(a=>
  a.name.toLowerCase().includes(query)
 ));
}

function openAnime(anime){
 currentAnime=anime;
 document.getElementById("playerSection").style.display="block";
 document.getElementById("animeTitle").textContent=anime.name;
 document.getElementById("episodeInfo").textContent=
  "Select an episode of "+anime.name;
 document.getElementById("video").pause();
 document.getElementById("video").removeAttribute("src");
 document.getElementById("video").load();
 document.getElementById("videoUrl").value="";

 const list=document.getElementById("episodes");
 list.innerHTML="";
 for(let i=1;i<=Math.min(anime.count,12);i++){
  const btn=document.createElement("button");
  btn.textContent="Episode "+i;
  btn.onclick=()=>{
   document.getElementById("episodeInfo").textContent=
    anime.name+" — Episode "+i+
    ". Add the authorised video URL to play it.";
  };
  list.appendChild(btn);
 }
 document.getElementById("playerSection")
  .scrollIntoView({behavior:"smooth"});
}

function loadVideo(){
 const input=document.getElementById("videoUrl").value.trim();
 const note=document.getElementById("episodeInfo");
 try{
  const url=new URL(input);
  if(!["https:","http:"].includes(url.protocol))throw Error();
  const video=document.getElementById("video");
  video.src=url.href;
  video.load();
  note.textContent="Video source loaded. Playback depends on URL compatibility and access permissions.";
 }catch(e){
  note.textContent="Enter a valid HTTP or HTTPS video URL.";
 }
}

function closePlayer(){
 document.getElementById("video").pause();
 document.getElementById("playerSection").style.display="none";
}

document.getElementById("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")filterAnime();
});

render(animeData);
</script>
</body>
</html>
