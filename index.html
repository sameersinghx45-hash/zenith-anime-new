
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Anime</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #09090f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      background: #151520;
      border-bottom: 1px solid #343044;
    }

    .logo {
      color: #a970ff;
      font-size: 25px;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .player {
      width: 100%;
      background: black;
      border: 1px solid #6e36c8;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
    }

    h2 { margin-top: 22px; }

    .episode {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      text-align: left;
      color: white;
      background: #191923;
      border: 1px solid #343044;
      border-radius: 8px;
      cursor: pointer;
    }

    .episode:hover {
      border-color: #a970ff;
    }

    .note {
      color: #b8b8c8;
      font-size: 13px;
      line-height: 1.6;
    }

    #status {
      color: #c6a4ff;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">⚡ ZENITH ANIME</div>
  </header>

  <main>
    <h2 id="title">Anime Video Player</h2>

    <div class="player">
      <video
        id="video"
        controls
        playsinline
        preload="metadata"
        poster=""
      >
        Your browser does not support video playback.
      </video>
    </div>

    <p id="status">Select an episode to start.</p>

    <h2>Episodes</h2>

    <button class="episode" onclick="playEpisode(0)">
      ▶ Test Video — Episode 1
    </button>

    <button class="episode" onclick="playEpisode(1)">
      ▶ My Licensed Video — Episode 2
    </button>

    <p class="note">
      Episode 1 is a sample test video, not an anime episode.
      Replace the second URL in the code with a video URL you
      own or are authorized to stream.
    </p>
  </main>

  <script>
    const episodes = [
      {
        title: "Player Test",
        url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      },
      {
        title: "My Licensed Video",
        url: "YOUR_AUTHORIZED_MP4_URL_HERE"
      }
    ];

    const video = document.getElementById("video");
    const title = document.getElementById("title");
    const status = document.getElementById("status");

    function playEpisode(index) {
      const episode = episodes[index];

      if (!episode.url ||
          episode.url.includes("YOUR_AUTHORIZED")) {
        status.textContent =
          "Add your authorized video URL in the code first.";
        return;
      }

      video.pause();
      video.src = episode.url;
      video.load();

      title.textContent = episode.title;
      status.textContent = "Video ready. Press Play.";

      video.play().then(() => {
        status.textContent = "Now playing: " + episode.title;
      }).catch(() => {
        status.textContent =
          "Press Play to start, or check whether the video URL works.";
      });
    }

    video.addEventListener("error", () => {
      status.textContent =
        "Video could not load. Check the URL, format and hosting permissions.";
    });

    playEpisode(0);
  </script>
</body>
</html>
