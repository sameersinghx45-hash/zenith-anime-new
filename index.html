
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080810">
<title>Zenith Anime</title>
<style>
:root{--cyan:#00f5ff;--pink:#ff28b8;--bg:#080810}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f6f6ff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#11111d;border-bottom:1px solid #29293b}
h1{margin:0;color:var(--cyan);letter-spacing:2px}
header p,.muted{color:#aaa}
main{max-width:1150px;margin:auto;padding:16px}
input{width:100%;padding:14px;background:#12121e;color:white;border:1px solid #37374d;border-radius:10px;font-size:16px}
h2{color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.card{background:#12121d;border:1px solid #29293c;border-radius:12px;overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#222}
.card .info{padding:10px}
.card h3{font-size:14px;line-height:1.4;min-height:38px;margin:0 0 9px}
button{padding:10px 12px;background:#111f2b;color:var(--cyan);border:1px solid var(--cyan);border-radius:8px;cursor:pointer}
button:disabled{opacity:.5}
.card button{width:100%}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
section{margin-top:24px}
.panel{padding:15px;background:#11111b;border:1px solid #303047;border-radius:12px}
#details{display:grid;grid-template-columns:110px 1fr;gap:14px}
#poster{width:100%;border-radius:8px}
#player{width:100%;aspect-ratio:16/9;border:0;background:#000;border-radius:10px}
#episodes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
a{color:var(--cyan)}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>
<body>
<header>
  <h1>⚡ ZENITH ANIME</h1>
  <p>Discover anime. Find your next favourite.</p>
</header>

<main>
  <input id="search" placeholder="Search anime..." autocomplete="off">
  <div class="controls">
    <button id="trending">Trending Anime</button>
    <button id="popular">Popular Anime</button>
  </div>

  <p id="status" class="muted">Loading anime catalogue...</p>
  <div id="catalog" class="grid"></div>
  <div class="controls">
    <button id="more">Load More</button>
  </div>

  <section id="detailsSection" class="panel" hidden>
    <h2 id="animeTitle">Anime details</h2>
    <div id="details">
      <img id="poster" alt="Anime poster">
      <div>
        <p id="meta"></p>
        <p id="description"></p>
        <p id="genres"></p>
        <p id="episodeCount"></p>
        <a id="animePage" target="_blank" rel="noopener">View anime information</a>
      </div>
    </div>

    <h2>Episodes</h2>
    <p id="episodeStatus" class="muted"></p>
    <div id="episodes"></div>

    <h2>Video Player</h2>
    <iframe id="player" title="Anime video player"
      src="about:blank"
      allow="encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <p class="muted">Only configured, officially embeddable videos can play here.</p>
  </section>
</main>

<footer>ZENITH ANIME · Anime discovery</footer>

<script>
const API = "https://graphql.anilist.co";

/*
Add only verified, authorized YouTube embeds here.
Use the exact anime title as the key.
No invented episode IDs are included.
*/
const OFFICIAL_VIDEO_SOURCES = {
  /*
  "Example Anime": [
    { episode: 1, videoId: "VERIFIED_VIDEO_ID" }
  ]
  */
};

const query = `
query ($page: Int, $search: String, $sort: [MediaSort]) {
  Page(page: $page, perPage: 24) {
    pageInfo { hasNextPage }
    media(type: ANIME, isAdult: false, search: $search, sort: $sort) {
      id
      title { romaji english }
      coverImage { large }
      episodes
      seasonYear
      averageScore
      description(asHtml: false)
      genres
      siteUrl
      format
      status
    }
  }
}`;

const catalog = document.getElementById("catalog");
const statusEl = document.getElementById("status");
const search = document.getElementById("search");
const detailsSection = document.getElementById("detailsSection");
const episodeList = document.getElementById("episodes");
const player = document.getElementById("player");

let page = 1;
let currentSearch = "";
let currentSort = "TRENDING_DESC";
let loading = false;
let hasNextPage = false;
let searchTimer;

async function requestAnime(reset = true) {
  if (loading) return;
  loading = true;

  if (reset) {
    page = 1;
    catalog.replaceChildren();
  }

  statusEl.textContent = "Loading anime...";
  document.getElementById("more").disabled = true;

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        query,
        variables: {
          page,
          search: currentSearch || null,
          sort: [currentSort]
        }
      })
    });

    if (!response.ok) throw new Error("API request failed");

    const result = await response.json();
    if (result.errors) throw new Error("Anime catalogue unavailable");

    const data = result.data.Page;
    hasNextPage = data.pageInfo.hasNextPage;

    data.media.forEach(anime => {
      const card = document.createElement("article");
      card.className = "card";

      const img = document.createElement("img");
      img.src = anime.coverImage.large;
      img.alt = anime.title.english || anime.title.romaji;
      img.loading = "lazy";

      const info = document.createElement("div");
      info.className = "info";

      const heading = document.createElement("h3");
      heading.textContent = anime.title.english || anime.title.romaji;

      const button = document.createElement("button");
      button.textContent = "View Details";
      button.onclick = () => openAnime(anime);

      info.append(heading, button);
      card.append(img, info);
      catalog.append(card);
    });

    statusEl.textContent = catalog.children.length
      ? "Anime catalogue loaded."
      : "No anime found. Try another title.";

    document.getElementById("more").disabled = !hasNextPage;
  } catch (error) {
    statusEl.textContent =
      "Could not load anime. Check your internet and try again.";
  } finally {
    loading = false;
  }
}

function openAnime(anime) {
  detailsSection.hidden = false;
  document.getElementById("animeTitle").textContent =
    anime.title.english || anime.title.romaji;

  document.getElementById("poster").src = anime.coverImage.large;
  document.getElementById("meta").textContent =
    `${anime.format || "Anime"} · ${anime.seasonYear || "Year unknown"} · ` +
    `${anime.averageScore ? anime.averageScore + "/100 score" : "Not rated"}`;

  document.getElementById("description").textContent =
    (anime.description || "No description available.")
      .replace(/<[^>]*>/g, "")
      .slice(0, 900);

  document.getElementById("genres").textContent =
    "Genres: " + (anime.genres || []).join(", ");

  document.getElementById("episodeCount").textContent =
    "Episodes listed: " + (anime.episodes ?? "Not available");

  const link = document.getElementById("animePage");
  link.href = anime.siteUrl || "https://anilist.co/";

  episodeList.replaceChildren();
  player.src = "about:blank";

  const title = anime.title.english || anime.title.romaji;
  const sources = OFFICIAL_VIDEO_SOURCES[title] || [];

  if (!sources.length) {
    document.getElementById("episodeStatus").textContent =
      "Episode count is available, but no verified playable video sources " +
      "are configured for this anime yet.";
  } else {
    document.getElementById("episodeStatus").textContent =
      "Select an available episode:";

    sources.forEach(source => {
      const btn = document.createElement("button");
      btn.textContent = "Episode " + source.episode;

      btn.onclick = () => {
        if (!/^[A-Za-z0-9_-]{11}$/.test(source.videoId)) {
          document.getElementById("episodeStatus").textContent =
            "The configured video ID is invalid.";
          return;
        }

        player.src =
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(source.videoId);
      };

      episodeList.append(btn);
    });
  }

  detailsSection.scrollIntoView({ behavior: "smooth" });
}

search.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = search.value.trim();
    requestAnime(true);
  }, 450);
});

document.getElementById("trending").onclick = () => {
  currentSearch = "";
  search.value = "";
  currentSort = "TRENDING_DESC";
  requestAnime(true);
};

document.getElementById("popular").onclick = () => {
  currentSearch = "";
  search.value = "";
  currentSort = "POPULARITY_DESC";
  requestAnime(true);
};

document.getElementById("more").onclick = () => {
  if (!loading && hasNextPage) {
    page++;
    requestAnime(false);
  }
};

requestAnime();
</script>
</body>
</html>
