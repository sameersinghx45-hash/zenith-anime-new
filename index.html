
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b12;color:#f5f5f7;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#151522;text-align:center;border-bottom:1px solid #29293c}
h1{margin:0;color:#9b87ff;font-size:30px}
header p{color:#b8b8ca;margin-bottom:0}
main{max-width:1000px;margin:auto;padding:18px}
input,select{width:100%;padding:13px;margin-bottom:12px;border-radius:10px;border:1px solid #38384c;background:#171725;color:white;font-size:16px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.card{background:#171725;border:1px solid #29293c;border-radius:14px;overflow:hidden;cursor:pointer}
.poster{height:155px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:21px;font-weight:bold;background:linear-gradient(140deg,#36256c,#171725 65%,#5b285f)}
.card h3{margin:12px 10px 5px}
.card p{color:#b9b9ca;margin:0 10px 14px;font-size:13px}
button{border:0;border-radius:9px;padding:11px 14px;background:#7860ef;color:white;font-weight:bold;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:5;overflow:auto;padding:18px;align-items:center;justify-content:center}
.panel{width:100%;max-width:650px;background:#171725;border:1px solid #38384c;border-radius:16px;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h2{margin:8px 0}
#close{background:#333348;font-size:18px}
.player{position:relative;width:100%;aspect-ratio:16/9;margin-top:18px;background:#050508;border-radius:12px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.note{font-size:13px;color:#b9b9ca;line-height:1.5}
footer{text-align:center;padding:25px;color:#9696a8;font-size:13px}
</style>
</head>
<body>
<header>
<h1>ZENITH ANIME</h1>
<p>Discover your next anime ✨</p>
</header>
<main>
<input id="search" placeholder="Search anime..." aria-label="Search anime">
<div class="filters">
<select id="genre">
<option value="All">All genres</option>
<option>Action</option>
<option>Fantasy</option>
<option>Adventure</option>
<option>Sports</option>
</select>
<select id="sort">
<option value="az">Name: A–Z</option>
<option value="new">Year: newest</option>
</select>
</div>
<div id="grid" class="grid"></div>
</main>
<div id="modal" class="modal">
<div class="panel">
<div class="top">
<h2 id="title"></h2>
<button id="close" aria-label="Close">✕</button>
</div>
<div id="details"></div>
<div id="playerArea"></div>
<p class="note">Videos are embedded from YouTube. Availability depends on the video owner and YouTube's playback settings.</p>
</div>
</div>
<footer>Zenith Anime • Fan discovery website</footer>
<script>
const animeData = [
{title:"Demon Slayer",genre:"Action",year:2019,season:"Multiple seasons",trailer:"Jd_B6ox3qGc",desc:"Tanjiro begins a journey to protect his sister and fight demons."},
{title:"Solo Leveling",genre:"Fantasy",year:2024,season:"Multiple seasons",trailer:"Bca7dy1Hntc",desc:"Sung Jinwoo discovers a mysterious power."},
{title:"Naruto",genre:"Action",year:2002,season:"Long-running series",trailer:"",desc:"A young ninja dreams of becoming Hokage."},
{title:"One Piece",genre:"Adventure",year:1999,season:"Long-running series",trailer:"",desc:"Luffy and his crew search for legendary treasure."},
{title:"Blue Lock",genre:"Sports",year:2022,season:"Multiple seasons",trailer:"scNHgkRlJn4",desc:"Strikers compete to become Japan's best striker."},
{title:"Jujutsu Kaisen",genre:"Action",year:2020,season:"Multiple seasons",trailer:"qrEAcRQzzbA",desc:"Yuji enters the dangerous world of curses."}
];

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const genre=document.getElementById("genre");
const sort=document.getElementById("sort");
const modal=document.getElementById("modal");

function render(){
 let items=animeData.filter(a=>
  a.title.toLowerCase().includes(search.value.toLowerCase()) &&
  (genre.value==="All"||a.genre===genre.value)
 );
 if(sort.value==="az")items.sort((a,b)=>a.title.localeCompare(b.title));
 else items.sort((a,b)=>b.year-a.year);
 grid.innerHTML=items.map(a=>`
  <article class="card" data-title="${a.title}">
   <div class="poster">${a.title}</div>
   <h3>${a.title}</h3>
   <p>${a.genre} • ${a.year}</p>
  </article>
 `).join("");
}
search.addEventListener("input",render);
genre.addEventListener("change",render);
sort.addEventListener("change",render);

grid.addEventListener("click",event=>{
 const card=event.target.closest(".card");
 if(!card)return;
 const anime=animeData.find(a=>a.title===card.dataset.title);
 document.getElementById("title").textContent=anime.title;
 document.getElementById("details").innerHTML=
  `<p><strong>Genre:</strong> ${anime.genre}<br>
  <strong>Year:</strong> ${anime.year}<br>
  <strong>Series:</strong> ${anime.season}</p>
  <p>${anime.desc}</p>`;
 document.getElementById("playerArea").innerHTML=anime.trailer
  ? `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(anime.trailer)}" title="${anime.title} trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`
  : `<p class="note">Trailer has not been added yet.</p>`;
 modal.style.display="flex";
});
document.getElementById("close").addEventListener("click",()=>{
 modal.style.display="none";
 document.getElementById("playerArea").innerHTML="";
});
modal.addEventListener("click",event=>{
 if(event.target===modal){
  modal.style.display="none";
  document.getElementById("playerArea").innerHTML="";
 }
});
document.addEventListener("keydown",event=>{
 if(event.key==="Escape"){
  modal.style.display="none";
  document.getElementById("playerArea").innerHTML="";
 }
});
render();
</script>
</body>
</html>
