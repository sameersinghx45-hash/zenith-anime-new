
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rambo Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090914;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#151329;display:flex;justify-content:space-between;gap:12px;align-items:center}
.logo{font-size:22px;font-weight:bold}
.logo span{color:#ff4fa3}
input,select{padding:12px;border-radius:9px;border:1px solid #444;background:#1c1c32;color:white;max-width:100%}
#search{width:50%}
.hero{padding:45px 20px;background:linear-gradient(120deg,#3b1762,#090914)}
h1{font-size:40px;margin:10px 0}
.hero span{color:#ff4fa3}
button{padding:11px 15px;background:#9955ff;color:white;border:0;border-radius:9px;cursor:pointer}
main{padding:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#17172a;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover}
.card div{padding:10px}
.card h3{font-size:14px;margin:0 0 7px}
.muted{color:#aaa;font-size:12px}
#modal{display:none;position:fixed;inset:0;overflow:auto;background:#080810f5;padding:16px}
#panel{max-width:700px;margin:auto;background:#17172a;padding:18px;border-radius:14px}
#poster{width:110px;float:left;margin:0 15px 10px 0;border-radius:9px}
#player{clear:both;padding-top:20px}
video,iframe{width:100%;aspect-ratio:16/9;background:black;border:0;margin-top:12px}
label{display:block;margin:12px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
p{line-height:1.6;color:#ccc}
.close{float:right}
@media(min-width:650px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<div class="logo">RAMBO <span>ANIME</span></div>
<input id="search" placeholder="Search anime...">
</header>

<section class="hero">
<p>YOUR ANIME UNIVERSE</p>
<h1>ENTER THE <span>ANIME</span> WORLD</h1>
<p>Discover anime, explore details and play videos from authorized sources.</p>
</section>

<main>
<h2>🔥 Popular Anime</h2>
<div id="grid" class="grid">Loading anime...</div>
</main>

<div id="modal">
<div id="panel">
<button class="close" onclick="closeAnime()">✕ Close</button>
<div style="clear:both"></div>
<img id="poster" alt="Anime poster">
<h2 id="title"></h2>
<p id="info"></p>
<p id="description"></p>
<div style="clear:both"></div>

<div id="player">
<h3>🎬 Episode Player</h3>
<div class="row">
<div>
<label for="season">Season</label>
<select id="season">
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option>
</select>
</div>
<div>
<label for="episode">Episode</label>
<select id="episode"></select>
</div>
</div>

<label for="url">Authorized video URL</label>
<input id="url" style="width:100%" placeholder="https://example.com/video.mp4">
<br><br>
<button onclick="playEpisode()">▶ Play Episode</button>
<button onclick="playTrailer()">Play Trailer</button>
<button onclick="stopVideo()">Stop</button>
<p id="message">Choose an episode and enter a video URL.</p>
<video id="video" controls playsinline style="display:none"></video>
<iframe id="frame" title="YouTube trailer" allowfullscreen style="display:none"></iframe>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let animeList=[],selected=null;

async function loadAnime(){
const query=`query {
Page(page:1,perPage:30){
media(type:ANIME,sort:POPULARITY_DESC,isAdult:false){
id title{romaji english}
coverImage{large extraLarge}
description(asHtml:false)
episodes averageScore seasonYear format genres
trailer{id site}
}
}
}`;
try{
const r=await fetch("https://graphql.anilist.co",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({query})
});
if(!r.ok)throw Error("Network error");
const data=await r.json();
animeList=data.data.Page.media;
render(animeList);
}catch(e){
$("grid").textContent="Anime load nahi hua. Internet check karke refresh karo.";
}
}

function render(list){
$("grid").innerHTML="";
list.forEach(a=>{
const card=document.createElement("article");
card.className="card";
const img=document.createElement("img");
img.loading="lazy";
img.src=a.coverImage.extraLarge||a.coverImage.large||"";
img.alt=a.title.english||a.title.romaji||"Anime";
const box=document.createElement("div");
const h=document.createElement("h3");
h.textContent=a.title.english||a.title.romaji;
const meta=document.createElement("span");
meta.className="muted";
meta.textContent=(a.seasonYear||"—")+" • ★ "+(a.averageScore?a.averageScore/10:"N/A");
box.append(h,meta);
card.append(img,box);
card.onclick=()=>openAnime(a);
$("grid").append(card);
});
}

$("search").addEventListener("input",()=>{
const q=$("search").value.toLowerCase();
render(animeList.filter(a=>
((a.title.english||"")+" "+(a.title.romaji||"")).toLowerCase().includes(q)
));
});

function openAnime(a){
selected=a;
$("title").textContent=a.title.english||a.title.romaji;
$("poster").src=a.coverImage.extraLarge||a.coverImage.large||"";
$("info").textContent=(a.format||"Anime")+" • "+(a.seasonYear||"Year unknown")+" • "+(a.episodes||"Unknown")+" episodes";
$("description").textContent=(a.description||"No description available.").replace(/<[^>]*>/g,"");
$("episode").innerHTML="";
const total=Math.min(a.episodes||12,100);
for(let i=1;i<=total;i++){
const opt=document.createElement("option");
opt.value=i;opt.textContent="Episode "+i;
$("episode").append(opt);
}
$("url").value="";
stopVideo();
$("message").textContent="Selected anime: "+$("title").textContent;
$("modal").style.display="block";
}

function closeAnime(){
$("modal").style.display="none";
stopVideo();
}

function stopVideo(){
$("video").pause();
$("video").removeAttribute("src");
$("video").load();
$("video").style.display="none";
$("frame").src="about:blank";
$("frame").style.display="none";
}

function getYouTubeEmbed(value){
try{
const u=new URL(value);
let id="";
if(u.hostname==="youtu.be")id=u.pathname.slice(1);
else if(u.hostname.endsWith("youtube.com")){
if(u.pathname==="/watch")id=u.searchParams.get("v")||"";
else if(u.pathname.startsWith("/embed/"))id=u.pathname.split("/")[2]||"";
}
id=id.split("/")[0];
return /^[\w-]{11}$/.test(id)
?"https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1":null;
}catch(e){return null;}
}

function playEpisode(){
const value=$("url").value.trim();
if(!value){$("message").textContent="Pehle authorized video URL enter karo.";return;}
let u;
try{u=new URL(value)}catch(e){
$("message").textContent="Valid complete URL enter karo.";return;
}
if(u.protocol!=="https:"){
$("message").textContent="HTTPS URL use karo.";return;
}
stopVideo();
const embed=getYouTubeEmbed(value);
if(embed){
$("frame").src=embed;
$("frame").style.display="block";
$("message").textContent="YouTube video loading.";
return;
}
$("video").src=u.href;
$("video").style.display="block";
$("video").play().catch(()=>{
$("message").textContent="Video loaded ho sakta hai. Play dabao ya URL check karo.";
});
}

function playTrailer(){
if(!selected||!selected.trailer||selected.trailer.site!=="youtube"){
$("message").textContent="Is anime ka YouTube trailer listed nahi hai.";
return;
}
$("url").value="https://www.youtube.com/watch?v="+selected.trailer.id;
playEpisode();
}

loadAnime();
</script>
</body>
</html>
