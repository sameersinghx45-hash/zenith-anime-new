
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#121522;position:sticky;top:0;z-index:2}
.logo{font-size:27px;font-weight:900;color:#a78bfa}
.logo span{color:white}
input{width:100%;padding:14px;margin-top:15px;border-radius:10px;border:1px solid #38394c;background:#090b12;color:white;font-size:16px}
.hero{text-align:center;padding:35px 16px;background:linear-gradient(130deg,#38106b,#111827)}
.hero h1{font-size:34px;margin:0 0 10px}
.hero p{color:#ddd;line-height:1.5}
main{padding:16px}
h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:#171b29;border-radius:12px;overflow:hidden}
.card img{width:100%;height:235px;object-fit:cover}
.info{padding:10px}
.info h3{font-size:15px;min-height:35px}
.meta{font-size:12px;color:#c1c5d4;margin-bottom:12px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:#8b5cf6;color:white;font-weight:bold;font-size:14px;cursor:pointer}
.details{background:#24283a;margin-top:7px}
#status{text-align:center;padding:22px;color:#ccc}
footer{text-align:center;padding:25px;color:#999}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="logo">ZENITH <span>ANIME</span></div>
  <input id="search" placeholder="Search anime..." autocomplete="off">
</header>

<section class="hero">
  <h1>Anime Universe</h1>
  <p>Discover your next favourite anime.</p>
</section>

<main>
  <h2>🔥 Popular Anime</h2>
  <div id="status">Loading anime...</div>
  <div id="grid" class="grid"></div>
</main>

<footer>ZENITH ANIME · Discover anime officially</footer>

<script>
const API = "https://graphql.anilist.co";
const query = `
query {
  Page(page:1,perPage:30) {
    media(type:ANIME,sort:POPULARITY_DESC,isAdult:false) {
      id
      title { romaji english }
      coverImage { large }
      seasonYear
      episodes
      averageScore
      description(asHtml:false)
    }
  }
}`;

let animeList = [];

function safe(value=""){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

async function loadAnime(){
  const status=document.getElementById("status");
  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify({query})
    });
    if(!res.ok) throw new Error("API error");
    const json=await res.json();
    if(!json.data) throw new Error("No data");

    animeList=json.data.Page.media;
    status.style.display="none";
    render(animeList);
  }catch(e){
    status.textContent=
      "Anime load nahi hua. Internet check karke refresh karo.";
  }
}

function render(list){
  const grid=document.getElementById("grid");
  if(!list.length){
    grid.innerHTML="<p>No anime found.</p>";
    return;
  }

  grid.innerHTML=list.map(a=>{
    const title=a.title.english||a.title.romaji||"Anime";
    const score=a.averageScore
      ?(a.averageScore/10).toFixed(1)+"/10":"N/A";

    return `
      <article class="card">
        <img src="${safe(a.coverImage.large)}"
             alt="${safe(title)}" loading="lazy">
        <div class="info">
          <h3>${safe(title)}</h3>
          <div class="meta">
            ${a.seasonYear||"Year N/A"} · ⭐ ${score}
          </div>
          <button onclick="watchAnime(${a.id})">
            Watch Officially
          </button>
          <button class="details" onclick="details(${a.id})">
            Anime Details
          </button>
        </div>
      </article>`;
  }).join("");
}

function watchAnime(id){
  const a=animeList.find(x=>x.id===id);
  if(!a)return;

  const title=a.title.english||a.title.romaji;
  const url="https://www.justwatch.com/in/search?q="
            +encodeURIComponent(title);

  window.open(url,"_blank","noopener,noreferrer");
}

function details(id){
  const a=animeList.find(x=>x.id===id);
  if(!a)return;

  const title=a.title.english||a.title.romaji;
  const description=(a.description||"No description available.")
    .replace(/<[^>]*>/g," ")
    .slice(0,650);

  alert(
    title+"\n\n"+
    "Year: "+(a.seasonYear||"Unknown")+"\n"+
    "Episodes: "+(a.episodes||"Unknown")+"\n\n"+
    description
  );
}

document.getElementById("search").addEventListener("input",e=>{
  const term=e.target.value.toLowerCase().trim();
  render(animeList.filter(a=>
    ((a.title.english||"")+" "+(a.title.romaji||""))
      .toLowerCase().includes(term)
  ));
});

loadAnime();
</script>
</body>
</html>
