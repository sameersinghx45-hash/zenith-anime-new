
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#f5f5ff;font-family:Arial,sans-serif}
header{padding:22px;background:#121624;text-align:center}
h1{margin:0;color:#a78bfa}
main{max-width:1100px;margin:auto;padding:18px}
input,button,select{padding:12px;border-radius:8px;border:1px solid #343950;font-size:15px}
input,select{background:#171b2a;color:white;max-width:100%}
button{background:#8b5cf6;color:white;border:0;cursor:pointer}
.search{display:flex;gap:8px;margin:18px 0}
.search input{flex:1;min-width:0}
#status{color:#c4b5fd;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.card{background:#151a29;border:1px solid #30364b;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:205px;object-fit:cover;background:#222}
.card h3{font-size:15px;padding:0 10px}
.card p{font-size:12px;color:#b8bfd1;padding:0 10px}
.panel{margin-top:25px;padding:16px;background:#151a29;border-radius:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.row>*{flex:1}
.episode{padding:12px;border-bottom:1px solid #34394b;line-height:1.5}
.episode small{display:block;color:#b8bfd1}
a{color:#c4b5fd}
footer{text-align:center;color:#aab0c1;padding:25px}
</style>
</head>
<body>
<header>
  <h1>ZENITH ANIME</h1>
  <p>Discover anime • Browse episodes • Explore seasons</p>
</header>

<main>
  <div class="search">
    <input id="query" placeholder="Search anime name...">
    <button id="searchBtn">Search</button>
  </div>
  <p id="status">Loading popular anime...</p>
  <div id="results" class="grid"></div>

  <section id="details" class="panel" hidden>
    <h2 id="animeTitle">Anime</h2>
    <p id="animeInfo"></p>
    <p id="relations"></p>
    <div class="row">
      <select id="seasonSelect" aria-label="Related anime entries"></select>
      <button id="loadEpisodes">Load episodes</button>
    </div>
    <p id="episodeStatus"></p>
    <div id="episodes"></div>
    <div class="row">
      <button id="prevPage">Previous page</button>
      <button id="nextPage">Next page</button>
    </div>
    <p id="pageInfo"></p>
    <p><a id="malLink" target="_blank" rel="noopener noreferrer">Open anime information source</a></p>
  </section>
</main>

<footer>Zenith Anime · Catalogue and information</footer>

<script>
const API = "https://api.jikan.moe/v4";
const $ = id => document.getElementById(id);

let selected = null;
let page = 1;
let lastPage = 1;
let busy = false;
let requestId = 0;

async function api(path) {
  const response = await fetch(API + path);
  if (!response.ok) {
    if (response.status === 429) {
      throw new Error("Too many requests. Wait a few seconds and try again.");
    }
    throw new Error("Database request failed (" + response.status + ").");
  }
  return response.json();
}

function safeText(value) {
  return value == null || value === "" ? "Not available" : String(value);
}

function renderCards(items) {
  $("results").replaceChildren();

  items.forEach(anime => {
    const card = document.createElement("article");
    card.className = "card";
    card.tabIndex = 0;

    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = anime.title;
    img.src = anime.images?.jpg?.image_url || "";

    const title = document.createElement("h3");
    title.textContent = anime.title;

    const info = document.createElement("p");
    info.textContent =
      (anime.type || "Anime") + " · " +
      (anime.episodes == null ? "Episode count unknown" :
       anime.episodes + " episodes");

    card.append(img, title, info);
    card.addEventListener("click", () => openAnime(anime));
    card.addEventListener("keydown", e => {
      if (e.key === "Enter") openAnime(anime);
    });
    $("results").append(card);
  });
}

async function searchAnime() {
  const q = $("query").value.trim();
  $("status").textContent = "Loading anime...";
  $("results").replaceChildren();

  try {
    const path = q
      ? "/anime?q=" + encodeURIComponent(q) + "&page=1&limit=24"
      : "/top/anime?page=1&limit=24";

    const result = await api(path);
    renderCards(result.data || []);
    $("status").textContent =
      (result.data?.length || 0) + " results on this page. Search for more anime by name.";
  } catch (error) {
    $("status").textContent = error.message;
  }
}

async function openAnime(anime) {
  selected = anime;
  page = 1;
  requestId++;
  $("details").hidden = false;
  $("animeTitle").textContent = anime.title;
  $("animeInfo").textContent =
    "Type: " + safeText(anime.type) +
    " · Episodes listed: " + safeText(anime.episodes) +
    " · Status: " + safeText(anime.status);
  $("malLink").href = anime.url || "https://myanimelist.net/";
  $("relations").textContent = "Loading related seasons and entries...";
  $("seasonSelect").replaceChildren();
  $("episodes").replaceChildren();
  $("episodeStatus").textContent = "Loading information...";
  $("details").scrollIntoView({behavior:"smooth"});

  const id = requestId;
  try {
    const [relations, episodes] = await Promise.all([
      api("/anime/" + anime.mal_id + "/relations"),
      api("/anime/" + anime.mal_id + "/episodes?page=1")
    ]);

    if (id !== requestId) return;

    const related = [];
    (relations.data || []).forEach(group => {
      (group.entry || []).forEach(entry => {
        if (entry.type === "anime" &&
            !related.some(x => x.mal_id === entry.mal_id)) {
          related.push(entry);
        }
      });
    });

    const currentOption = document.createElement("option");
    currentOption.value = String(anime.mal_id);
    currentOption.textContent = anime.title + " (selected)";
    $("seasonSelect").append(currentOption);

    related.forEach(entry => {
      const option = document.createElement("option");
      option.value = String(entry.mal_id);
      option.textContent = entry.name + " · related entry";
      $("seasonSelect").append(option);
    });

    $("relations").textContent = related.length
      ? "Related anime entries are available in the selector. These are database relations, not guaranteed official season numbers."
      : "No related anime entries were returned by the database.";

    showEpisodes(episodes, id);
  } catch (error) {
    if (id !== requestId) return;
    $("episodeStatus").textContent =
      error.message + " Try again in a few seconds.";
  }
}

function showEpisodes(result, id) {
  if (id !== requestId) return;
  $("episodes").replaceChildren();

  (result.data || []).forEach(ep => {
    const item = document.createElement("div");
    item.className = "episode";

    const title = document.createElement("strong");
    title.textContent = "Episode " + safeText(ep.mal_id) +
      ": " + safeText(ep.title);

    const details = document.createElement("small");
    details.textContent =
      "Aired: " + safeText(ep.aired) +
      " · Filler: " + (ep.filler ? "Yes" : "No");

    item.append(title, details);
    $("episodes").append(item);
  });

  page = result.pagination?.current_page || page;
  lastPage = result.pagination?.last_visible_page || 1;

  $("episodeStatus").textContent = result.data?.length
    ? "Episode information from the database. This is not a video player."
    : "No episode entries were returned.";

  $("pageInfo").textContent = "Episode list page " + page +
    " of " + lastPage;

  $("prevPage").disabled = page <= 1;
  $("nextPage").disabled = page >= lastPage;
}

async function loadEpisodePage(nextPage) {
  if (!selected || busy || nextPage < 1) return;

  busy = true;
  $("episodeStatus").textContent = "Loading episode page...";
  const id = requestId;

  try {
    const result = await api(
      "/anime/" + selected.mal_id + "/episodes?page=" + nextPage
    );
    if (id !== requestId) return;
    showEpisodes(result, id);
  } catch (error) {
    $("episodeStatus").textContent = error.message;
  } finally {
    busy = false;
  }
}

$("searchBtn").addEventListener("click", searchAnime);
$("query").addEventListener("keydown", e => {
  if (e.key === "Enter") searchAnime();
});

$("loadEpisodes").addEventListener("click", async () => {
  const id = Number($("seasonSelect").value);
  if (!id) return;

  if (selected && id === selected.mal_id) {
    await loadEpisodePage(1);
    return;
  }

  try {
    const result = await api("/anime/" + id);
    const anime = result.data;
    if (anime) openAnime(anime);
  } catch (error) {
    $("episodeStatus").textContent = error.message;
  }
});

$("prevPage").addEventListener("click", () => loadEpisodePage(page - 1));
$("nextPage").addEventListener("click", () => loadEpisodePage(page + 1));

searchAnime();
</script>
</body>
</html>
