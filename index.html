
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080810">
<title>Zenith Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080810;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#11111d;border-bottom:1px solid #00eaff}
h1,h2{color:#00f5ff}
header h1{margin:0;letter-spacing:2px}
header p,.muted{color:#aaa}
main{max-width:1100px;margin:auto;padding:16px}
input{width:100%;padding:14px;background:#151522;color:white;border:1px solid #444;border-radius:10px;font-size:16px}
.controls,.episodes{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{padding:10px;background:#101f2b;color:#00f5ff;border:1px solid #00f5ff;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.card{background:#12121d;border:1px solid #29293c;border-radius:12px;overflow:hidden}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222}
.info{padding:10px}
.info h3{font-size:14px;min-height:35px}
.info button{width:100%}
.panel{margin-top:24px;padding:15px;background:#11111b;border:1px solid #33334b;border-radius:12px}
#details{display:grid;grid-template-columns:105px 1fr;gap:14px}
#poster{width:100%;border-radius:8px}
#player{width:100%;aspect-ratio:16/9;border:0;background:#000;border-radius:10px}
a{color:#00f5ff}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>
<body>
<header>
<h1>⚡ ZENITH ANIME</h1>
<p>Discover anime · Search · Watch</p>
</header>
<main>
<input id="search" placeholder="Search anime..." autocomplete="off">
<div class="controls">
<button id="trending">Trending</button>
<button id="popular">Popular</button>
</div>
<p id="status" class="muted">Loading catalogue...</p>
<div id="catalog" class="grid"></div>
<div class="controls"><button id="more">Load More</button></div>

<section id="watch" class="panel" hidden>
<h2 id="animeTitle"></h2>
<div id="details">
<img id="poster" alt="Anime poster">
<div>
<p id="meta"></p>
<p id="description"></p>
<p id="genres"></p>
<a id="animePage" target="_blank" rel="noopener">Anime information</a>
</div>
</div>
<h2>Available Episodes</h2>
<p id="episodeStatus" class="muted"></p>
<div id="episodes" class="episodes"></div>
<h2>Video Player</h2>
<iframe id="player" title="Anime player"
src="about:blank"
allow="encrypted-media; picture-in-picture; fullscreen"
allowfullscreen
referrerpolicy="strict-origin-when-cross-origin"></iframe>
</section>
</main>
<footer>ZENITH ANIME</footer>

<script>
const API="https://graphql.anilist.co";

const query=`
query($page:Int,$search:String,$sort:[MediaSort]){
 Page(page:$page,perPage:24){
  pageInfo{hasNextPage}
  media(type:ANIME,isAdult:false,search:$search,sort:$sort){
   id
   title{romaji english}
   coverImage{large}
   episodes
   seasonYear
   averageScore
   description(asHtml:false)
   genres
   siteUrl
   format
  }
 }
}`;

const catalog=document.getElementById("catalog");
const search=document.getElementById("search");
const status=document.getElementById("status");
const watch=document.getElementById("watch");
const player=document.getElementById("player");
const episodes=document.getElementById("episodes");
let page=1, term="", sort="TRENDING_DESC";
let busy=false, hasNext=false, timer;

function officialSources(anime) {
  const titles = [
    anime.title.english || "",
    anime.title.romaji || ""
  ].join(" ").toLowerCase();

  if (
    titles.includes("unicorn") &&
    (titles.includes("0096") || titles.includes("re:0096"))
  ) {
    return [{
      label: "Official episode playlist",
      playlist: "PLAKqAsKfNksU"
    }];
  }

  return [];
}

async function load(reset=true){
 if(busy)return;
 busy=true;
 if(reset){page=1;catalog.replaceChildren()}
 status.textContent="Loading anime...";
 document.getElementById("more").disabled=true;

 try{
  const res=await fetch(API,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Accept":"application/json"
   },
   body:JSON.stringify({
    query,
    variables:{
     page,
     search:term||null,
     sort:[sort]
    }
   })
  });
  if(!res.ok)throw Error("Request failed");
  const json=await res.json();
  if(json.errors)throw Error("API error");

  const data=json.data.Page;
  hasNext=data.pageInfo.hasNextPage;

  data.media.forEach(anime=>{
   const card=document.createElement("article");
   card.className="card";

   const img=document.createElement("img");
   img.src=anime.coverImage.large;
   img.alt=anime.title.english||anime.title.romaji;
   img.loading="lazy";

   const info=document.createElement("div");
   info.className="info";

   const h=document.createElement("h3");
   h.textContent=anime.title.english||anime.title.romaji;

   const btn=document.createElement("button");
   btn.textContent="View Details";
   btn.onclick=()=>openAnime(anime);

   info.append(h,btn);
   card.append(img,info);
   catalog.append(card);
  });

  status.textContent=catalog.children.length
   ?"Catalogue loaded."
   :"No anime found.";
  document.getElementById("more").disabled=!hasNext;
 }catch(e){
  status.textContent=
   "Catalogue could not load. Check internet and reload.";
 }finally{
  busy=false;
 }
}

function openAnime(anime){
 watch.hidden=false;
 const name=anime.title.english||anime.title.romaji;
 document.getElementById("animeTitle").textContent=name;
 document.getElementById("poster").src=anime.coverImage.large;
 document.getElementById("meta").textContent=
  `${anime.format||"Anime"} · ${anime.seasonYear||"Year unknown"} · `+
  `${anime.episodes??"?"} episodes`;
 document.getElementById("description").textContent=
  (anime.description||"No description available.")
   .replace(/<[^>]*>/g,"").slice(0,800);
 document.getElementById("genres").textContent=
  "Genres: "+(anime.genres||[]).join(", ");
 document.getElementById("animePage").href=
  anime.siteUrl||"https://anilist.co/";

 episodes.replaceChildren();
 player.src="about:blank";
 const sources=officialSources(anime);

 if(!sources.length){
  document.getElementById("episodeStatus").textContent=
   "No configured official video source for this anime yet.";
 }else{
  document.getElementById("episodeStatus").textContent=
   "Select the official playlist:";
  sources.forEach(source=>{
   const btn=document.createElement("button");
   btn.textContent=source.label;
   btn.onclick=()=>{
    player.src=
     "https://www.youtube-nocookie.com/embed/videoseries?list="+
     encodeURIComponent(source.playlist);
    document.getElementById("episodeStatus").textContent=
     "Loading official playlist...";
   };
   episodes.append(btn);
  });
 }
 watch.scrollIntoView({behavior:"smooth"});
}

search.addEventListener("input",()=>{
 clearTimeout(timer);
 timer=setTimeout(()=>{
  term=search.value.trim();
  load(true);
 },450);
});

document.getElementById("trending").onclick=()=>{
 term="";search.value="";sort="TRENDING_DESC";load(true);
};
document.getElementById("popular").onclick=()=>{
 term="";search.value="";sort="POPULARITY_DESC";load(true);
};
document.getElementById("more").onclick=()=>{
 if(!busy&&hasNext){page++;load(false)}
};
load();
</script>
</body>
</html>
