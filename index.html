<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090f">
<title>Zenith Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090f;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#11111b;border-bottom:1px solid #29293c}
.logo{font-size:27px;font-weight:900;color:#a78bfa}
header p{color:#aaa;font-size:13px}
main{padding:18px;max-width:1200px;margin:auto}
.search{display:flex;gap:8px;margin:18px 0}
input{flex:1;min-width:0;padding:14px;border:1px solid #39394d;border-radius:10px;background:#171722;color:white;font-size:16px}
button{padding:12px 16px;border:0;border-radius:10px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
h2{font-size:19px}
#status{color:#c4b5fd;font-size:14px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#151520;border:1px solid #29293c;border-radius:12px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover;background:#242433}
.info{padding:11px}
.info h3{font-size:15px;margin:0 0 8px}
.info p{font-size:12px;color:#bbb;line-height:1.5}
.info button{width:100%;font-size:12px}
#more{display:block;margin:22px auto}
footer{text-align:center;color:#777;padding:25px;font-size:12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card img{height:280px}}
</style>
</head>
<body>
<header>
  <div class="logo">✦ ZENITH ANIME</div>
  <p>Your anime discovery universe</p>
</header>

<main>
  <h2>Discover Anime</h2>
  <div class="search">
    <input id="query" placeholder="Search anime..." />
    <button id="searchBtn">Search</button>
  </div>
  <div id="status">Loading popular anime...</div>
  <div id="results" class="grid"></div>
  <button id="more" hidden>Load More</button>
</main>

<footer>Zenith Anime · Anime information and discovery</footer>

<script>
const API = "https://api.tenrai.org/v1";
const results = document.getElementById("results");
const statusBox = document.getElementById("status");
const moreBtn = document.getElementById("more");
const queryInput = document.getElementById("query");

let page = 1;
let currentQuery = "";
let busy = false;

function safeText(value) {
  return String(value ?? "Not available");
}

function makeCard(anime) {
  const card = document.createElement("article");
  card.className = "card";

  const img = document.createElement("img");
  img.loading = "lazy";
  img.alt = safeText(anime.title);
  img.src = anime.images?.jpg?.large_image_url ||
            anime.images?.jpg?.image_url || "";
  img.onerror = () => { img.style.display = "none"; };

  const info = document.createElement("div");
  info.className = "info";

  const title = document.createElement("h3");
  title.textContent = safeText(anime.title_english || anime.title);

  const details = document.createElement("p");
  details.textContent =
    "⭐ " + safeText(anime.score) +
    " · " + safeText(anime.type) +
    " · Episodes: " + safeText(anime.episodes);

  const button = document.createElement("button");
  button.textContent = "View Details";
  button.onclick = () => {
    const synopsis = anime.synopsis || "No synopsis available.";
    const genres = (anime.genres || []).map(g => g.name).join(", ");
    const url = anime.url || "";
    alert(
      (anime.title_english || anime.title) +
      "\n\n" + synopsis +
      "\n\nGenres: " + (genres || "Not available") +
      "\n\nEpisodes: " + safeText(anime.episodes) +
      "\n\nOfficial catalogue page:\n" + url
    );
  };

  info.append(title, details, button);
  card.append(img, info);
  results.append(card);
}

async function loadAnime(reset = false) {
  if (busy) return;
  busy = true;
  moreBtn.hidden = true;

  if (reset) {
    page = 1;
    results.replaceChildren();
  }

  statusBox.textContent = "Loading anime...";

  try {
    const params = new URLSearchParams({
      page: String(page),
      limit: "24"
    });
    if (currentQuery) params.set("q", currentQuery);

    const response = await fetch(`${API}/anime?${params}`);
    if (!response.ok) {
      throw new Error("API returned status " + response.status);
    }

    const json = await response.json();
    const animeList = json.data || [];

    if (reset && animeList.length === 0) {
      statusBox.textContent = "No anime found. Try another title.";
    } else if (animeList.length > 0) {
      statusBox.textContent = "Showing anime catalogue results.";
      animeList.forEach(makeCard);
      moreBtn.hidden = !json.pagination?.has_next_page;
    } else {
      statusBox.textContent = "No more results.";
    }
  } catch (error) {
    statusBox.textContent =
      "Anime data could not load. Check your internet or try again later.";
    console.error(error);
  } finally {
    busy = false;
  }
}

document.getElementById("searchBtn").addEventListener("click", () => {
  currentQuery = queryInput.value.trim();
  loadAnime(true);
});

queryInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    currentQuery = queryInput.value.trim();
    loadAnime(true);
  }
});

moreBtn.addEventListener("click", () => {
  page++;
  loadAnime(false);
});

loadAnime(true);
</script>
</body>
</html>
