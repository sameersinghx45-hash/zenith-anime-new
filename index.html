<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenith Anime Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #080810;
      color: white;
      font-family: Arial, sans-serif;
    }
    h1 { color: #00f5ff; }
    .panel {
      max-width: 850px;
      margin: 20px auto;
      padding: 18px;
      background: #141421;
      border: 1px solid #292943;
      border-radius: 16px;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      color: white;
      background: #090912;
      border: 1px solid #45455d;
    }
    button {
      border: 0;
      color: #080810;
      background: #00f5ff;
      font-weight: bold;
    }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-top: 15px;
      background: black;
      border-radius: 10px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .note { color: #b8b8c9; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>ZENITH ANIME</h1>
    <h2>Watch Anime</h2>
    <p class="note">
      Play officially available episodes from an embedded playlist.
    </p>

    <label for="playlist">YouTube playlist ID</label>
    <input id="playlist"
      placeholder="Paste playlist ID here">

    <button onclick="loadPlaylist()">Load Episodes</button>

    <div class="player" id="player">
      <p class="note" style="padding:15px">
        Your anime playlist will appear here.
      </p>
    </div>

    <p class="note">
      Some videos may be unavailable for embedding or in your region.
    </p>
  </div>

  <script>
    function loadPlaylist() {
      const id = document.getElementById("playlist")
        .value.trim();

      // Accept only a YouTube playlist ID.
      if (!/^PL[\w-]+$/.test(id)) {
        alert("Enter a valid YouTube playlist ID.");
        return;
      }

      const frame = document.createElement("iframe");
      frame.src =
        "https://www.youtube-nocookie.com/embed/videoseries?list=" +
        encodeURIComponent(id);
      frame.title = "Zenith Anime playlist player";
      frame.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      frame.allowFullscreen = true;
      frame.referrerPolicy = "strict-origin-when-cross-origin";

      const player = document.getElementById("player");
      player.replaceChildren(frame);
    }
  </script>
</body>
</html>
