
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:white;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#121522;position:sticky;top:0;z-index:5}
.logo{font-size:27px;font-weight:900;color:#8b5cf6}
.logo span{color:#fff}
.search{width:100%;margin-top:16px;padding:13px;border:1px solid #33394d;border-radius:10px;background:#090b12;color:white;font-size:16px}
.hero{padding:32px 18px;background:linear-gradient(135deg,#25104c,#101827);text-align:center}
.hero h1{font-size:34px;margin:5px 0 12px}
.hero p{color:#c4c6d4;line-height:1.6}
button{border:0;border-radius:8px;padding:11px 15px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
main{padding:18px}
.section-title{font-size:22px;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#151925;border-radius:12px;overflow:hidden;border:1px solid #252b3a}
.card img{width:100%;height:230px;object-fit:cover;background:#202436}
.info{padding:11px}
.info h3{font-size:15px;margin:0 0 8px;line-height:1.4}
.meta{font-size:12px;color:#b5b9ca;margin-bottom:10px}
.card button{width:100%;padding:10px 5px}
.status{text-align:center;padding:22px;color:#b5b9ca}
footer{text-align:center;padding:24px;color:#999;font-size:12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card img{height:290px}}
</style>
</head>
<body>
<header>
  <div class="logo">ZENITH <span>ANIME</span></div>
  <input id="search" class="search" placeholder="Search anime..." autocomplete="off">
</header>

<section class="hero">
  <h1>Your Anime Universe</h1>
  <p>Discover anime, explore stories and find your next favourite series.</p>
  <button onclick="document.getElementById('anime').scrollIntoView({behavior:'smooth'})">
    Explore Anime
  </button>
</section>

<main>
  <h2 class="section-title">🔥 Popular Anime</h2>
  <div id="status" class="status">Loading anime...</div>
  <div id="anime" class="grid"></div>
</main>

<footer>ZENITH ANIME · Anime discovery website</footer>

<script>
const API = "https://graphql.anilist.co";

/* Change this to your own published website URL. */
const WEBSITE_URL = "https://sameersinghx45-hash.github.io/zenith-anime-new/";

const query = `
query {
  Page(page: 1, perPage: 24) {
    media(type: ANIME, sort: POPULARITY_DESC, isAdult: false) {
      id
      title { romaji english }
      coverImage { large }
      episodes
      averageScore
      seasonYear
      genres
      description(asHtml: false)
      siteUrl
    }
  }
}`;

let allAnime = [];

async function loadAnime() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query})
    });

    if (!response.ok) throw new Error("Anime service unavailable");

    const result = await response.json();
    allAnime = result.data.Page.media;
    status.style.display = "none";
    renderAnime(allAnime);
  } catch (error) {
    status.textContent = "Anime load nahi hua. Internet check karke page refresh karo.";
  }
}

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[char]));
}

function renderAnime(list) {
  const container = document.getElementById("anime");

  if (!list.length) {
    container.innerHTML = '<p class="status">No anime found.</p>';
    return;
  }

  container.innerHTML = list.map(anime => {
    const title = anime.title.english || anime.title.romaji || "Anime";
    const year = anime.seasonYear || "Year unknown";
    const score = anime.averageScore
      ? (anime.averageScore / 10).toFixed(1) + "/10"
      : "Not rated";

    return `
      <article class="card">
        <img src="${escapeHTML(anime.coverImage.large)}"
             alt="${escapeHTML(title)}"
             loading="lazy">
        <div class="info">
          <h3>${escapeHTML(title)}</h3>
          <div class="meta">${year} · ⭐ ${score}</div>
          <button onclick="showDetails(${anime.id})">Anime Details</button>
        </div>
      </article>`;
  }).join("");
}

function showDetails(id) {
  const anime = allAnime.find(item => item.id === id);
  if (!anime) return;

  const title = anime.title.english || anime.title.romaji;
  const genres = anime.genres.join(", ") || "Not listed";
  const description = (anime.description || "No description available.")
    .replace(/<[^>]*>/g, " ")
    .replace(/\s+/g, " ")
    .slice(0, 600);

  const details = [
    title,
    "",
    "Year: " + (anime.seasonYear || "Unknown"),
    "Episodes: " + (anime.episodes || "Unknown"),
    "Genres: " + genres,
    "",
    description,
    "",
    "Official information: " + anime.siteUrl
  ].join("\n");

  alert(details);
  // Anime information comes from AniList.
  // Streaming links should point to authorized providers.
}

document.getElementById("search").addEventListener("input", event => {
  const term = event.target.value.toLowerCase().trim();

  renderAnime(allAnime.filter(anime => {
    const title = (
      (anime.title.english || "") + " " +
      (anime.title.romaji || "")
    ).toLowerCase();

    return title.includes(term);
  }));
});

loadAnime();
</script>
</body>
</html>
