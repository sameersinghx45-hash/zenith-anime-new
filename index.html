
<section class="panel" id="watch">
  <h2>Watch <span class="neon" id="selectedTitle">Anime</span></h2>
  <p id="episodeInfo">Choose an episode below.</p>

  <div class="player" id="player">
    <p style="padding:16px">Select an available episode to start watching.</p>
  </div>

  <h3>Episodes</h3>
  <div id="episodeList"></div>
</section>

<script>
const officialEpisodes = {
  "Demo Anime": [
    // Add only authorized, embeddable video IDs here.
    // Example format: { title: "Episode 1", videoId: "YOUR_VIDEO_ID" }
  ]
};

function showEpisodes(animeTitle) {
  document.getElementById("selectedTitle").textContent = animeTitle;
  const list = document.getElementById("episodeList");
  const player = document.getElementById("player");
  const info = document.getElementById("episodeInfo");

  list.replaceChildren();
  player.replaceChildren();

  const episodes = officialEpisodes[animeTitle] || [];

  if (!episodes.length) {
    info.textContent =
      "No verified, officially embeddable episodes are configured for this anime yet.";
    return;
  }

  info.textContent = "Select an episode to play it here.";

  episodes.forEach((episode) => {
    const button = document.createElement("button");
    button.textContent = episode.title;
    button.style.margin = "5px";

    button.addEventListener("click", () => {
      if (!/^[A-Za-z0-9_-]{11}$/.test(episode.videoId)) {
        info.textContent = "This episode does not have a valid video source.";
        return;
      }

      const frame = document.createElement("iframe");
      frame.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(episode.videoId);
      frame.title = episode.title;
      frame.allow =
        "accelerometer; autoplay; encrypted-media; picture-in-picture";
      frame.allowFullscreen = true;

      player.replaceChildren(frame);
      info.textContent = "Now selected: " + episode.title;
    });

    list.appendChild(button);
  });
}
</script>
