
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090912">
<title>Zenith Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090912;color:#f8f7ff;font-family:Arial,sans-serif}
header{padding:22px 5%;background:#10101d;border-bottom:1px solid #28243c}
.logo{font-size:28px;font-weight:900;letter-spacing:1px;color:#b59aff}
header p{margin:8px 0 0;color:#aaa;font-size:13px}
.hero{padding:35px 5% 25px;background:linear-gradient(130deg,#21143d,#10101d 65%,#111827)}
.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 12px}
.hero h1 span{color:#b59aff}
.hero p{color:#c5c1d3;line-height:1.6}
.search{display:flex;gap:8px;max-width:650px;margin-top:22px}
input{width:100%;min-width:0;padding:14px;background:#171725;color:white;border:1px solid #39354f;border-radius:10px;font-size:16px}
button{background:#8b5cf6;color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
main{max-width:1400px;margin:auto;padding:24px 5%}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-size:22px}
#status{color:#c4b5fd;font-size:14px;line-height:1.6;margin:12px 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{min-width:0;background:#141420;border:1px solid #29283a;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-4px);border-color:#8b5cf6}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#242238}
.info{padding:11px}
.info h3{font-size:14px;line-height:1.4;margin:0 0 8px}
.meta{font-size:12px;color:#aaa;line-height:1.6}
.score{color:#facc15}
.more{display:block;margin:25px auto}
.hidden{display:none!important}
footer{text-align:center;color:#777;padding:30px 15px;font-size:12px}
.overlay{position:fixed;inset:0;z-index:5;background:#000c;display:none;overflow:auto;padding:20px}
.overlay.open{display:block}
.modal{max-width:750px;margin:20px auto;background:#151521;border:1px solid #39334f;border-radius:16px;padding:20px}
.modalTop{display:flex;gap:18px}
.modalPoster{width:125px;max-height:190px;object-fit:cover;border-radius:8px}
.modal h2{margin-top:0}
.description{white-space:pre-wrap;color:#ccc;line-height:1.65;font-size:14px}
.related{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
.relatedItem{min-width:115px;max-width:125px;background:#20202e;border-radius:8px;overflow:hidden;color:white;text-decoration:none;font-size:12px}
.relatedItem img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.relatedItem span{display:block;padding:8px}
.close{float:right;background:#302b43}
a.external{display:inline-block;margin-top:10px;color:#c4b5fd}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.info h3{font-size:15px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="logo">✦ ZENITH ANIME</div>
  <p>Discover your next anime obsession.</p>
</header>

<section class="hero">
  <h1>Your Anime <span>Universe.</span></h1>
  <p>Explore anime, discover new favourites and find related series.</p>
  <form class="search" id="searchForm">
    <input id="searchInput" placeholder="Search Naruto, One Piece..." aria-label="Search anime">
    <button id="searchButton" type="submit">Search</button>
  </form>
</section>

<main>
  <div class="toolbar">
    <h2 id="heading">Trending Anime</h2>
    <button id="trendingButton">Trending</button>
  </div>
  <div id="status" role="status">Connecting to anime catalogue...</div>
  <div id="grid" class="grid"></div>
  <button id="moreButton" class="more hidden">Load More</button>
</main>

<footer>Zenith Anime · Catalogue powered by AniList</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" id="closeButton">Close ✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const API = "https://graphql.anilist.co";
const grid = document.getElementById("grid");
const statusBox = document.getElementById("status");
const moreButton = document.getElementById("moreButton");
const searchInput = document.getElementById("searchInput");
const heading = document.getElementById("heading");
const searchButton = document.getElementById("searchButton");

let page = 1;
let searchTerm = "";
let busy = false;
let mode = "TRENDING_DESC";

const listQuery = `
query ($page:Int,$search:String,$sort:[MediaSort]) {
  Page(page:$page,perPage:24) {
    pageInfo { hasNextPage }
    media(type:ANIME,search:$search,sort:$sort,isAdult:false) {
      id
      title { romaji english }
      coverImage { large }
      averageScore
      episodes
      format
      seasonYear
      siteUrl
    }
  }
}`;

const detailQuery = `
query ($id:Int) {
  Media(id:$id,type:ANIME) {
    id
    title { romaji english native }
    coverImage { extraLarge large }
    averageScore
    episodes
    format
    status
    seasonYear
    genres
    description(asHtml:false)
    siteUrl
    relations {
      edges {
        relationType
        node {
          id
          type
          title { romaji english }
          coverImage { large }
          format
          episodes
          siteUrl
        }
      }
    }
  }
}`;

async function api(query, variables) {
  const response = await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify({query, variables})
  });

  const result = await response.json();

  if (!response.ok || result.errors?.length) {
    throw new Error(result.errors?.[0]?.message || "API error " + response.status);
  }
  return result.data;
}

function makeElement(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function makeCard(anime) {
  const card = makeElement("article", "card");
  card.tabIndex = 0;

  const img = makeElement("img", "poster");
  img.loading = "lazy";
  img.alt = anime.title.english || anime.title.romaji || "Anime poster";
  img.src = anime.coverImage?.large || "";

  const info = makeElement("div", "info");
  const title = makeElement("h3", "", anime.title.english || anime.title.romaji || "Untitled");
  const meta = makeElement("div", "meta");

  const score = anime.averageScore
    ? "★ " + (anime.averageScore / 10).toFixed(1) + "/10"
    : "Score unavailable";

  meta.append(
    makeElement("div", "score", score),
    makeElement("div", "", (anime.format || "Anime") + " · " + (anime.seasonYear || "Year unknown")),
    makeElement("div", "", "Episodes: " + (anime.episodes ?? "Unknown"))
  );

  info.append(title, meta);
  card.append(img, info);
  card.addEventListener("click", () => showDetails(anime.id));
  card.addEventListener("keydown", e => {
    if (e.key === "Enter") showDetails(anime.id);
  });
  grid.append(card);
}

async function loadAnime(reset = true) {
  if (busy) return;
  busy = true;
  moreButton.disabled = true;
  moreButton.classList.add("hidden");
  searchButton.disabled = true;

  if (reset) {
    page = 1;
    grid.replaceChildren();
  }

  statusBox.textContent = "Loading anime...";
  heading.textContent = searchTerm ? "Search Results" :
    mode === "TRENDING_DESC" ? "Trending Anime" : "Popular Anime";

  try {
    const data = await api(listQuery, {
      page,
      search: searchTerm || null,
      sort: [mode]
    });

    const results = data.Page.media || [];
    results.forEach(makeCard);

    if (reset && results.length === 0) {
      statusBox.textContent = "No anime found. Try another title.";
    } else {
      statusBox.textContent = "Showing catalogue results. Tap a card for details.";
    }

    if (data.Page.pageInfo.hasNextPage) {
      moreButton.classList.remove("hidden");
    }
  } catch (error) {
    console.error(error);
    statusBox.textContent =
      "Could not load anime data. Check your internet and try again.";
  } finally {
    busy = false;
    moreButton.disabled = false;
    searchButton.disabled = false;
  }

  
async function showDetails(id) {
  const overlay = document.getElementById("overlay");
  const content = document.getElementById("modalContent");

  overlay.classList.add("open");
  content.replaceChildren(
    makeElement("p", "", "Loading anime details...")
  );

  try {
    const data = await api(detailQuery, { id });
    const anime = data.Media;

    if (!anime) {
      throw new Error("Anime details not found");
    }

    content.replaceChildren();

    const title =
      anime.title?.english ||
      anime.title?.romaji ||
      "Anime";

    const top = makeElement("div", "modalTop");
    const img = makeElement("img", "modalPoster");

    img.src =
      anime.coverImage?.extraLarge ||
      anime.coverImage?.large ||
      "";
    img.alt = title;

    const summary = makeElement("div", "");
    summary.append(
      makeElement("h2", "", title),
      makeElement(
        "p",
        "meta",
        "Episodes: " + (anime.episodes ?? "Not listed")
      ),
      makeElement(
        "p",
        "meta",
        "Format: " + (anime.format || "Unknown")
      ),
      makeElement(
        "p",
        "meta",
        "Release year: " + (anime.seasonYear || "Unknown")
      ),
      makeElement(
        "p",
        "meta",
        "Score: " +
          (anime.averageScore
            ? anime.averageScore / 10 + "/10"
            : "Not rated")
      ),
      makeElement(
        "p",
        "meta",
        "Status: " + (anime.status || "Unknown")
      ),
      makeElement(
        "p",
        "meta",
        "Genres: " + ((anime.genres || []).join(", ") || "Not listed")
      )
    );

    const link = makeElement("a", "external", "Open on AniList ↗");
    link.href = anime.siteUrl || "https://anilist.co";
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    summary.append(link);
    top.append(img, summary);
    content.append(top);

    content.append(makeElement("h3", "", "Synopsis"));
    content.append(
      makeElement(
        "p",
        "description",
        anime.description || "Synopsis not available."
      )
    );

    const relations = (anime.relations?.edges || []).filter(
      edge => edge.node?.type === "ANIME"
    );

    content.append(
      makeElement("h3", "", "Seasons & Related Anime")
    );

    const related = makeElement("div", "related");

    const relationNames = {
      PREQUEL: "Previous story",
      SEQUEL: "Next story / sequel",
      PARENT: "Parent series",
      SIDE_STORY: "Side story",
      SPIN_OFF: "Spin-off",
      ALTERNATIVE: "Alternative version",
      SUMMARY: "Summary",
      COMPILATION: "Compilation",
      OTHER: "Related anime",
      SOURCE: "Source material adaptation"
    };

    if (relations.length) {
      relations.forEach(edge => {
        const item = makeElement("a", "relatedItem");
        item.href = "#";

        item.addEventListener("click", event => {
          event.preventDefault();
          showDetails(edge.node.id);
        });

        const poster = makeElement("img");
        poster.loading = "lazy";
        poster.src = edge.node.coverImage?.large || "";
        poster.alt =
          edge.node.title?.english ||
          edge.node.title?.romaji ||
          "Related anime";

        const nodeTitle =
          edge.node.title?.english ||
          edge.node.title?.romaji ||
          "Related anime";

        const relation =
          relationNames[edge.relationType] ||
          edge.relationType.replaceAll("_", " ").toLowerCase();

        const episodeCount =
          edge.node.episodes == null
            ? "Episodes: Not listed"
            : "Episodes: " + edge.node.episodes;

        item.append(
          poster,
          makeElement(
            "span",
            "",
            nodeTitle +
              "\n" + relation +
              "\n" + (edge.node.format || "Format unknown") +
              " • " + episodeCount
          )
        );

        related.append(item);
      });

      content.append(related);
    } else {
      content.append(
        makeElement(
          "p",
          "meta",
          "No related anime seasons or entries were listed by AniList."
        )
      );
    }
  } catch (error) {
    console.error(error);
    content.replaceChildren(
      makeElement(
        "p",
        "",
        "Could not load details. Please try again."
      )
    );
  }
}
  
  

document.getElementById("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  searchTerm = searchInput.value.trim();
  loadAnime(true);
});

document.getElementById("trendingButton").addEventListener("click", () => {
  searchTerm = "";
  searchInput.value = "";
  mode = "TRENDING_DESC";
  loadAnime(true);
});

moreButton.addEventListener("click", () => {
  page++;
  loadAnime(false);
});

document.getElementById("closeButton").addEventListener("click", () => {
  document.getElementById("overlay").classList.remove("open");
});

document.getElementById("overlay").addEventListener("click", event => {
  if (event.target.id === "overlay") {
    event.currentTarget.classList.remove("open");
  }
});

loadAnime(true);
</script>
</body>
</html>
