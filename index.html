
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080810;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#10101c;border-bottom:1px solid #00eaff}
.logo{font-size:25px;font-weight:900;color:#00eaff;letter-spacing:2px}
main{max-width:1000px;margin:auto;padding:20px}
.hero{padding:25px 0}
h1{font-size:clamp(30px,7vw,48px)}
p{color:#bcbcd0;line-height:1.5}
input{width:100%;padding:14px;border-radius:9px;background:#151522;color:white;border:1px solid #34344a;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card,.panel{background:#141421;border:1px solid #303047;border-radius:14px;overflow:hidden}
.poster{height:150px;display:grid;place-items:center;text-align:center;padding:15px;background:linear-gradient(135deg,#092e48,#38134b);color:#00eaff;font-weight:bold;font-size:20px}
.content{padding:15px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#00eaff;color:#050510;font-weight:bold;font-size:15px;cursor:pointer}
.panel{padding:16px;margin-top:24px}
.player{width:100%;aspect-ratio:16/9;background:#000;margin-top:15px;border-radius:10px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
.small{font-size:13px}
footer{text-align:center;padding:25px;color:#999}
</style>
</head>
<body>
<header><div class="logo">ZENITH ANIME</div></header>

<main>
<section class="hero">
<h1>YOUR ANIME <span style="color:#00eaff">WORLD</span></h1>
<p>Discover anime and watch available episodes inside Zenith Anime.</p>
<input id="search" type="search" placeholder="Search anime..." aria-label="Search anime">
</section>

<h2>Anime Library</h2>
<div class="grid" id="catalogue"></div>

<section class="panel" id="watch">
<h2 id="title">Choose an anime</h2>
<p id="message">Select a title from the library to see its available episodes.</p>
<div class="player" id="player">
<div style="padding:15px;color:#aaa">Your episode player will appear here.</div>
</div>
<div id="episodes"></div>
</section>
</main>

<footer>ZENITH ANIME · Watch responsibly</footer>

<script>
const anime = [
  {
    title: "Mobile Suit Gundam Unicorn Re:0096",
    genre: "Sci-fi · Mecha · Adventure",
    playlist: "PLAKqAsKfNksU"
  }
];

const catalogue = document.getElementById("catalogue");
const search = document.getElementById("search");
const player = document.getElementById("player");
const title = document.getElementById("title");
const message = document.getElementById("message");
const episodes = document.getElementById("episodes");

function showAnime(items) {
  catalogue.replaceChildren();

  items.forEach(item => {
    const card = document.createElement("article");
    card.className = "card";

    const poster = document.createElement("div");
    poster.className = "poster";
    poster.textContent = item.title;

    const content = document.createElement("div");
    content.className = "content";

    const heading = document.createElement("h3");
    heading.textContent = item.title;

    const genre = document.createElement("p");
    genre.textContent = item.genre;

    const button = document.createElement("button");
    button.textContent = "Watch Episodes";
    button.addEventListener("click", () => selectAnime(item));

    content.append(heading, genre, button);
    card.append(poster, content);
    catalogue.append(card);
  });
}

function selectAnime(item) {
  title.textContent = item.title;
  episodes.replaceChildren();
  player.replaceChildren();

  const frame = document.createElement("iframe");
  frame.src =
    "https://www.youtube-nocookie.com/embed/videoseries?list=" +
    encodeURIComponent(item.playlist);
  frame.title = item.title + " episode playlist";
  frame.allow =
    "accelerometer; autoplay; encrypted-media; picture-in-picture; web-share";
  frame.allowFullscreen = true;
  frame.referrerPolicy = "strict-origin-when-cross-origin";

  player.append(frame);
  message.textContent =
    "Select an episode from the playlist controls inside the player.";
  document.getElementById("watch").scrollIntoView({behavior:"smooth"});
}

search.addEventListener("input", () => {
  const q = search.value.toLowerCase();
  showAnime(anime.filter(item => item.title.toLowerCase().includes(q)));
});

showAnime(anime);
</script>
</body>
</html>
